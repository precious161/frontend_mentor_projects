<!DOCTYPE html>
<html lang="en">
  <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
     <title>Blog Preview Card</title>
  </head>
  <body>
     <main>
      <article class="blog-card">
          <img class="blog-card__image" alt="" src="./assets/images/illustration-article.svg">
          <span class="blog-card__tag">Learning</span>
          <time datetime="2003-12-21">Published 21 Dec 2003</time>
          <h2 class="blog-card__title">HTML & CSS foundations</h2>
          <p class="blog-card__description">These languages are the backbone of every website, defining structure, content, and presentation</p>

          <footer class="blog-card__author">
            <img class="blog-card__avatar" alt="Greg Hooper" src="./assets/images/image-avatar.webp">
            <span class="blog-card__name">Greg Hooper</span>
          </footer>
      </article>
     </main>
     <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>
      Coded by <a href="https://github.com/precious161">Feyruza</a>
     </footer>
  </body>
</html>
